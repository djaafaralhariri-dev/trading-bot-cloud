name: Markt-Scanner

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: trading-bot-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      BROKER_MODE: alpaca
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: 'true'
      ALPACA_ORDER_EXECUTION: 'false'
      ALPACA_ALLOW_SHORTS: 'false'
      ALPACA_DATA_FEED: iex
      ALPACA_REQUIRE_FRACTIONABLE: 'false'
      SCANNER_TOP_N: '40'
      SCANNER_MAX_CANDIDATES: '300'
      SCANNER_STOCK_SLOTS: '35'
      SCANNER_ETF_SLOTS: '5'
      SCANNER_CRYPTO_SLOTS: '0'
      SCANNER_FOREX_SLOTS: '0'
      MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS || '2' }}
      ALPACA_MAX_ORDER_NOTIONAL: ${{ vars.ALPACA_MAX_ORDER_NOTIONAL || '75' }}

    steps:
      - name: Dateien laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: Markt scannen
        run: python -m app.market_scanner --top 40

      - name: Dashboard aktualisieren
        run: python -m app.github_cloud --dashboard-only --ignore-market-clock

      - name: Dashboard in docs kopieren
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R site/. docs/

      - name: Scanner-Auswahl und Dashboard speichern
        run: |
          git config user.name "trading-bot-cloud"
          git config user.email "trading-bot-cloud@users.noreply.github.com"
          git add scanner_output docs
          if git diff --cached --quiet; then
            echo "Scanner-Auswahl und Dashboard unverändert."
          else
            git commit -m "Automatischer Markt-Scan und Dashboard"
            git push
          fi
